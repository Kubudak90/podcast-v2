# LiveKit Server Configuration - Production
# Note: Environment variables are passed via docker-compose

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  enable_loopback_candidate: false

redis:
  address: redis:6379

# Keys are set via environment variables in docker-compose
# LIVEKIT_KEYS environment variable format: "key: secret"

logging:
  level: info
  pion_level: warn
  json: true

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

# UDP TURN only. tls_port must stay 0 until a certificate and a real domain
# are mounted. LiveKit aborts startup with "TURN domain required" when TLS is
# on and domain is empty, and with "TURN tls cert required" when the cert files
# are missing. Relay ports are published 1:1 and sit beside the RTC range so
# the two allocators do not share a port.
turn:
  enabled: true
  tls_port: 0
  udp_port: 3478
  relay_range_start: 50101
  relay_range_end: 50200
