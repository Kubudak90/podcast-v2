# LiveKit Server Configuration
port: 7880
rtc:
  tcp_port: 7881
  # docker-compose publishes 50000-50100/udp. Candidates outside that range are unreachable.
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

redis:
  address: redis:6379

keys:
  # API Key : Secret - .env dosyasindan okunur
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

logging:
  level: info
  pion_level: warn

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

# Egress (kayit) icin
egress:
  enable_downloads: true
  s3:
    access_key: ${S3_ACCESS_KEY}
    secret: ${S3_SECRET_KEY}
    region: auto
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
